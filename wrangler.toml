name = "nuwavmedia1"
main = "worker/index.ts"
compatibility_date = "2025-08-04"

[build]
command = "npm install && npm run build"

# Static export from `next build` (output: 'export'). Only /api/* runs the Worker;
# every other path is served straight from these files.
[assets]
directory = "./out"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# Survey responses (see worker/index.ts).
[[durable_objects.bindings]]
name = "SURVEY"
class_name = "SurveyStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SurveyStore"]
