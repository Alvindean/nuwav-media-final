name = "nuwavmedia1"
compatibility_date = "2025-08-04"

# The site is a fully static Next.js export (`output: 'export'` -> ./out).
# Serve it with Workers Static Assets — no worker script, no next-on-pages.
[assets]
directory = "./out"
not_found_handling = "404-page"

[build]
command = "npm install && npm run build"
